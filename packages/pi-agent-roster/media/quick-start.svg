<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized Pi Agent Roster quick-start recording fallback</title>
  <desc id="desc">A deterministic terminal frame shows the roster status check, agent reload, primary profile selection, and one background reviewer reading files.</desc>
  <rect width="1200" height="520" fill="#0b1020"/>
  <rect x="34" y="28" width="1132" height="464" rx="16" fill="#101827" stroke="#334155" stroke-width="2"/>
  <path d="M50 28h1100a16 16 0 0 1 16 16v48H34V44a16 16 0 0 1 16-16Z" fill="#182235"/>
  <circle cx="66" cy="60" r="6" fill="#67e8f9"/>
  <text x="86" y="67" fill="#e7ecf3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" font-weight="700">QUICK START / RECORDING FALLBACK</text>
  <text x="1134" y="67" text-anchor="end" fill="#9aa8b8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">92 × 26</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">
    <text x="64" y="126" fill="#c4b5fd">›</text>
    <text x="86" y="126" fill="#e7ecf3">/roster-status</text>
    <text x="64" y="156" fill="#7ee787">Roster demo: roster_noop ready</text>

    <text x="64" y="202" fill="#c4b5fd">›</text>
    <text x="86" y="202" fill="#e7ecf3">/agents:reload</text>
    <text x="64" y="232" fill="#9aa8b8">Agent definitions reloaded.</text>

    <text x="64" y="278" fill="#c4b5fd">›</text>
    <text x="86" y="278" fill="#e7ecf3">/agent reviewer</text>
    <text x="64" y="308" fill="#7ee787">Primary agent set to reviewer.</text>

    <text x="64" y="354" fill="#e7ecf3" font-weight="700">Subagent · Reviewer ·</text>
    <text x="286" y="354" fill="#67e8f9">running</text>
    <text x="64" y="384" fill="#9aa8b8">Background · stack: default · model: provider/code-large · thinking: high</text>

    <text x="64" y="430" fill="#67e8f9" font-weight="700">● Background agents — 1 running</text>
    <text x="64" y="462" fill="#718096">└─</text>
    <text x="98" y="462" fill="#67e8f9">⠹</text>
    <text x="126" y="462" fill="#e7ecf3" font-weight="700">Reviewer</text>
    <text x="220" y="462" fill="#9aa8b8">3 tool uses · 7.8k token · context: 18% · activity: reading…</text>
  </g>
</svg>
