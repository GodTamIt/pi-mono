  <rect x="20" y="18" width="480" height="744" rx="14" fill="#fbfcfe" stroke="#c7d1df" stroke-width="2"/>
  <path d="M34 18h452a14 14 0 0 1 14 14v46H20V32a14 14 0 0 1 14-14Z" fill="#e9eef5"/>
  <circle cx="46" cy="48" r="5" fill="#087e8b"/>
