<svg xmlns="http://www.w3.org/2000/svg" width="520" height="780" viewBox="0 0 520 780" role="img" aria-labelledby="title desc">
  <title id="title">Pi Agent Roster in a narrow light terminal</title>
  <desc id="desc">A sanitized narrow terminal shows the subagent invocation row and background-agent widget wrapped to width, with the roster footer status clipped.</desc>
