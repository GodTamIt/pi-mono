<svg xmlns="http://www.w3.org/2000/svg" width="520" height="780" viewBox="0 0 520 780" role="img" aria-labelledby="title desc">
  <title id="title">Pi Agent Roster in a narrow light terminal</title>
  <desc id="desc">A sanitized narrow terminal demonstrates deliberate wrapping for agent stack, model, activity, task, and queue details without clipping.</desc>
  <rect width="520" height="780" fill="#eef2f6"/>
  <rect x="20" y="18" width="480" height="744" rx="14" fill="#fbfcfe" stroke="#c7d1df" stroke-width="2"/>
  <path d="M34 18h452a14 14 0 0 1 14 14v46H20V32a14 14 0 0 1 14-14Z" fill="#e9eef5"/>
  <circle cx="46" cy="48" r="5" fill="#087e8b"/>
  <text x="64" y="54" fill="#172033" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700">PI / AGENT ROSTER</text>
  <text x="474" y="54" text-anchor="end" fill="#607086" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">46 × 34</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">
    <text x="42" y="106" fill="#087e8b">$</text>
    <text x="62" y="106" fill="#172033">pi --agent lead --stack default</text>
    <text x="42" y="136" fill="#177245">✓ Primary agent set to lead.</text>

    <text x="42" y="182" fill="#6d4cc4">›</text>
    <text x="62" y="182" fill="#172033">Review access boundaries with a</text>
    <text x="62" y="208" fill="#172033">background reviewer.</text>

    <text x="42" y="254" fill="#172033" font-weight="700">Subagent · Reviewer ·</text>
    <text x="252" y="254" fill="#087e8b">running</text>
    <text x="42" y="282" fill="#607086">Background · stack: default</text>
    <text x="42" y="308" fill="#607086">model: provider/code-large</text>
    <text x="42" y="334" fill="#607086">thinking: high · elapsed: 8.4s</text>

    <text x="42" y="384" fill="#087e8b" font-weight="700">● Background agents — 1 running</text>
    <text x="42" y="420" fill="#8090a4">└─</text>
    <text x="74" y="420" fill="#087e8b">⠹</text>
    <text x="100" y="420" fill="#172033" font-weight="700">Reviewer</text>
    <text x="42" y="450" fill="#607086">   [Background · running]</text>
    <text x="42" y="484" fill="#607086">   stack: default</text>
    <text x="42" y="510" fill="#607086">   model: provider/code-large</text>
    <text x="42" y="536" fill="#607086">   thinking: high · turn 3</text>
    <text x="42" y="570" fill="#607086">   7 tool uses · 18.2k token</text>
    <text x="42" y="596" fill="#607086">   context: 31% · compactions: 0</text>
    <text x="42" y="630" fill="#607086">   task: review access boundaries</text>
    <text x="42" y="656" fill="#607086">   and error paths</text>
    <text x="42" y="690" fill="#607086">   activity: reading…</text>

    <text x="42" y="732" fill="#6d4cc4">❯</text>
    <text x="64" y="732" fill="#8090a4">Keep working…</text>
  </g>
</svg>
